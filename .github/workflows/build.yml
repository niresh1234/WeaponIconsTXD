# Save as:  .github/workflows/build.yml   (in your WeaponIconsTXD repo)
#
# Builds WeaponIconsTXD.VC.asi (and WeaponIconsTXD.SA.asi) on a GitHub-hosted
# Windows machine, so you don't need Visual Studio installed locally.
# Download the result from the run page -> "Artifacts".

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read

env:
  SDK_REPO: DK22Pac/plugin-sdk
  # Exact SDK commit this was prepared against. Use "master" to follow upstream.
  SDK_REF: 15f15b60bbf74c106e1b496ff92c98764abf4605
  # Both the SDK's own projects and your .vcxproj read this variable.
  PLUGIN_SDK_DIR: ${{ github.workspace }}\plugin-sdk

jobs:
  build:
    name: ${{ matrix.game }}

    # Pinned on purpose. Since June 2026 "windows-latest" is Visual Studio 2026,
    # but the SDK's premake generates VS2022 projects (toolset v143), and your
    # .vcxproj asks for v142. windows-2022 has VS2022, i.e. v143.
    # If GitHub retires windows-2022, switch to windows-2025-vs2026 AND change
    # "vs2022" -> "vs2026" and "v143" -> "v145" below (not tested by me).
    runs-on: windows-2022

    strategy:
      fail-fast: false      # a failing SA build won't cancel the VC build
      matrix:
        include:
          - game: VC
            config: GTAVC Release
            sdk_proj: plugin_vc\Plugin_VC.vcxproj
            asi: WeaponIconsTXD.VC.asi
          - game: SA
            config: GTASA Release
            sdk_proj: plugin_sa\Plugin_SA.vcxproj
            asi: WeaponIconsTXD.SA.asi

    steps:
      - name: Checkout mod
        uses: actions/checkout@v7

      - name: Checkout Plugin-SDK
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SDK_REPO }}
          ref: ${{ env.SDK_REF }}
          path: plugin-sdk

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      # The SDK static library takes a few minutes to compile; reuse it between runs.
      - name: Restore SDK library cache
        id: sdklib
        uses: actions/cache@v6
        with:
          path: plugin-sdk/output/lib
          key: sdklib-${{ matrix.game }}-windows-2022-v143-${{ env.SDK_REF }}

      # The SDK ships no .sln/.vcxproj; they are generated by its bundled premake.
      # (Cheap, so it always runs - it also writes shared/stdafx.h that the SDK needs.)
      - name: Generate SDK projects (premake)
        shell: pwsh
        run: |
          & "$env:PLUGIN_SDK_DIR\tools\premake\premake5.exe" vs2022 --file="$env:PLUGIN_SDK_DIR\tools\premake\premake5.lua"
          if ($LASTEXITCODE -ne 0) { throw "premake failed" }

      - name: Build SDK library (${{ matrix.game }})
        if: steps.sdklib.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          msbuild "$env:PLUGIN_SDK_DIR\${{ matrix.sdk_proj }}" /p:Configuration=Release /p:Platform=Win32 /m /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { throw "SDK library build failed" }

      # Command-line properties override the .vcxproj: toolset v142 -> v143,
      # and OutDir (the author's G:\ drive) -> a folder inside the workspace.
      - name: Build ${{ matrix.game }} .asi
        shell: pwsh
        run: |
          msbuild WeaponIconsTXD\WeaponIconsTXD.vcxproj `
            "/p:Configuration=${{ matrix.config }}" /p:Platform=Win32 `
            /p:PlatformToolset=v143 `
            "/p:OutDir=$env:GITHUB_WORKSPACE\out\${{ matrix.game }}\" `
            /m /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { throw "Mod build failed" }

      - name: Upload .asi
        uses: actions/upload-artifact@v7
        with:
          name: WeaponIconsTXD-${{ matrix.game }}
          path: out/${{ matrix.game }}/${{ matrix.asi }}
          if-no-files-found: error
