name: Build ASI

# Runs on every push, and can also be started by hand from the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - game: SA
            config: GTASA Release
            sdkproject: plugin_sa
          - game: VC
            config: GTAVC Release
            sdkproject: plugin_vc

    env:
      PLUGIN_SDK_DIR: ${{ github.workspace }}\plugin-sdk

    steps:
      - name: Get your project files
        uses: actions/checkout@v4

      - name: Download plugin-sdk
        run: git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git plugin-sdk

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build the plugin-sdk library (plugin.lib / plugin_vc.lib)
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Path plugin-sdk -Recurse -Filter "${{ matrix.sdkproject }}.vcxproj" | Select-Object -First 1
          if (-not $proj) { throw "Could not find ${{ matrix.sdkproject }}.vcxproj inside plugin-sdk" }
          Write-Host "Building $($proj.FullName)"
          msbuild $proj.FullName /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /m
          if ($LASTEXITCODE -ne 0) { throw "plugin-sdk library build failed" }
          Write-Host "Libraries now in plugin-sdk\output\lib:"
          Get-ChildItem plugin-sdk\output\lib -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name }

      - name: Build WeaponIconsTXD
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE/out/"
          msbuild WeaponIconsTXD/WeaponIconsTXD.vcxproj "/p:Configuration=${{ matrix.config }}" /p:Platform=Win32 /p:PlatformToolset=v143 "/p:OutDir=$out"
          if ($LASTEXITCODE -ne 0) { throw "WeaponIconsTXD build failed" }

      - name: Save the .asi so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: WeaponIconsTXD-${{ matrix.game }}
          path: out/*.asi
          if-no-files-found: error
